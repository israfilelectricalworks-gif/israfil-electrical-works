<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#08192d">
<title>Admin | Israfil Electrical Works</title>
<style>
:root{color-scheme:dark;--bg:#08192d;--panel:#102e4a;--line:#29445d;--gold:#ffd86a;--muted:#afc0d0;--white:#f7fafd;--red:#ff8a8a;--green:#77e5a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px/1.5 system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:800;background:var(--gold);color:#08192d}button.secondary{background:#173650;color:white;border:1px solid var(--line)}button.danger{background:#632d38;color:#fff}input,select,textarea{width:100%;background:#071523;color:white;border:1px solid var(--line);border-radius:8px;padding:11px}textarea{min-height:90px;resize:vertical}label{display:grid;gap:5px;font-size:13px;color:var(--muted)}.wrap{max-width:1250px;width:94%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.4px}.brand small{display:block;color:var(--gold);font-size:11px;letter-spacing:1.2px}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px;padding:22px 0}.sidebar,.panel,.login{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.sidebar{height:max-content;display:grid;gap:7px}.navbtn{background:transparent;color:#dce7ef;text-align:left;border:1px solid transparent}.navbtn.active,.navbtn:hover{background:#173b59;border-color:#3b5870;color:var(--gold)}.content{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}.pagehead h1{font-size:clamp(24px,4vw,34px);margin:0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{padding:16px;border:1px solid var(--line);border-radius:12px;background:#0a2137}.stat strong{display:block;font-size:26px;color:var(--gold)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.7px}td{font-size:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.notice{padding:12px;border-radius:9px;margin:12px 0;background:#0a2137;border:1px solid var(--line)}.error{color:var(--red)}.success{color:var(--green)}.hidden{display:none!important}.login{max-width:430px;margin:8vh auto}.login h1{margin-top:0}.stack{display:grid;gap:13px}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:#24425a;color:#ffe39a;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.imagepreview{max-width:160px;max-height:90px;object-fit:contain;background:#fff;border-radius:7px}.hint{font-size:12px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto}.navbtn{white-space:nowrap}.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:420px){.cards{grid-template-columns:1fr}.top{align-items:flex-start}}
</style>
</head><body>
<div id="loginView" class="wrap"><form id="loginForm" class="login stack"><div class="brand">ISRAFIL ELECTRICAL WORKS<small>ADMIN CONTROL PANEL</small></div><h1>Admin Login</h1><p class="muted">Authorized main admin only.</p><label>Email<input id="loginEmail" type="email" autocomplete="username" required maxlength="254"></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required minlength="8"></label><button type="submit">Secure Login</button><div id="loginMessage" class="notice hidden" role="status"></div><a class="muted" href="/">← Back to website</a></form></div>
<div id="appView" class="hidden"><header class="wrap top"><div class="brand">ISRAFIL ELECTRICAL WORKS<small>COMPLETE ELECTRICAL SOLUTION · ADMIN</small></div><div class="actions"><a href="/" target="_blank" rel="noopener"><button class="secondary" type="button">View Website ↗</button></a><button id="logoutBtn" class="secondary" type="button">Logout</button></div></header><div class="wrap layout"><nav class="sidebar" aria-label="Admin sections"><button class="navbtn active" data-tab="dashboard">Dashboard</button><button class="navbtn" data-tab="enquiries">Enquiries</button><button class="navbtn" data-tab="products">Products</button><button class="navbtn" data-tab="banners">Banner</button><button class="navbtn" data-tab="services">Services</button><button class="navbtn" data-tab="locations">Locations</button><button class="navbtn" data-tab="settings">Website Settings</button></nav><main class="content"><div id="globalMessage" class="notice hidden" role="status"></div><section id="tabContent"></section></main></div></div>
<div id="editorModal" class="hidden" style="position:fixed;inset:0;background:#000b;z-index:20;overflow:auto;padding:18px"><div class="wrap" style="max-width:760px;margin:3vh auto;background:#102e4a;border:1px solid #29445d;border-radius:16px;padding:20px"><div class="pagehead"><h2 id="editorTitle">Edit item</h2><button id="closeEditor" class="secondary" type="button">Close</button></div><form id="editorForm" class="stack"><div id="editorFields" class="formgrid"></div><div class="actions"><button type="submit">Save changes</button><button id="cancelEditor" type="button" class="secondary">Cancel</button></div><div id="editorMessage" class="hint"></div></form></div></div>
<script src="/admin-config.js"></script><script type="module" src="/admin.js"></script></body></html>
